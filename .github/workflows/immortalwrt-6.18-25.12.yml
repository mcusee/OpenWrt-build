name: Build OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: write

# 强制使用 Node.js 24（可选，升级到 v3 后其实可以去掉）
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360   # 6 小时

    strategy:
      fail-fast: false
      matrix:
        include:
          - kernel: '6.18'
            script: 'immortalwrt6.18-25.12.sh'

    steps:
      # 拉取你自己的仓库（包含 build-diy*.sh）
      - name: Checkout
        uses: actions/checkout@v5

      # 清理磁盘空间（推荐加上，减少 tar 失败概率）
      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          sudo apt-get clean
          df -h

      # 安装依赖
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -y \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd

      # 克隆 ImmortalWrt
      - name: Clone ImmortalWrt
        run: |
          git clone --depth 1 https://github.com/immortalwrt/immortalwrt.git immortalwrt

      # 缓存 dl（推荐保留，体积小、价值高）
      - name: Cache dl
        uses: actions/cache@v5
        with:
          path: immortalwrt/dl
          key: ${{ runner.os }}-immortalwrt-dl-${{ matrix.kernel }}
          restore-keys: |
            ${{ runner.os }}-immortalwrt-dl-

      # 执行对应的 DIY 脚本
      - name: Run DIY Script
        run: |
          test -f "${{ github.workspace }}/${{ matrix.script }}"
          chmod +x "${{ github.workspace }}/${{ matrix.script }}"
          cd immortalwrt
          "${{ github.workspace }}/${{ matrix.script }}" "${{ matrix.kernel }}"

      # 获取日期 + 内核版本
      - name: Get Build Info
        run: |
          # 设置当前日期
          echo "DATE=$(TZ=Asia/Shanghai date +%Y%m%d)" >> $GITHUB_ENV

          # 使用 matrix.kernel 直接设置内核版本
          echo "KERNEL=${{ matrix.kernel }}" >> $GITHUB_ENV

      # 上传固件
      - name: Upload Firmware
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DATE }}-openwrt-x86-k${{ env.KERNEL }}-firmware
          path: immortalwrt/bin/targets/x86/64/
          if-no-files-found: error

      # 上传 packages
      - name: Upload Packages
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.DATE }}-openwrt-x86-k${{ env.KERNEL }}-packages
          path: immortalwrt/bin/packages/x86_64/
          if-no-files-found: warn
          
      # 发布 Release（已升级到 v3，解决 Node.js 20 警告）
      - name: Publish Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.DATE }}-OpenWrt-k${{ env.KERNEL }}-Firmware
          name: ${{ env.DATE }}-OpenWrt-k${{ env.KERNEL }}-Firmware
          make_latest: ${{ matrix.kernel == '6.18' }}
          overwrite_files: true
          files: |
            immortalwrt/bin/targets/x86/64/*.img*
            immortalwrt/bin/targets/x86/64/*.vmdk
            immortalwrt/bin/targets/x86/64/*.qcow2
            immortalwrt/bin/targets/x86/64/sha256sums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 发送 Telegram 通知
      - name: Send Telegram Notification
        if: ${{ success() }}
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          [ -n "$TG_TOKEN" ] || exit 0
          [ -n "$TG_CHAT_ID" ] || exit 0
          MESSAGE="✅ OpenWrt 编译完成
          📅 版本: ${{ env.DATE }}
          🧠 Kernel: ${{ env.KERNEL }}
          🔗 下载:
          https://github.com/${{ github.repository }}/releases"
          curl -sS "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="${TG_CHAT_ID}" \
            -d text="$MESSAGE"